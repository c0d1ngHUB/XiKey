name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Assemble signed release APK
        env:
          XIKEY_STORE_FILE: ${{ secrets.XIKEY_STORE_FILE }}
          XIKEY_STORE_PASSWORD: ${{ secrets.XIKEY_STORE_PASSWORD }}
          XIKEY_KEY_ALIAS: ${{ secrets.XIKEY_KEY_ALIAS }}
          XIKEY_KEY_PASSWORD: ${{ secrets.XIKEY_KEY_PASSWORD }}
        run: |
          if [ -z "$XIKEY_STORE_FILE" ]; then
            echo "No signing secrets found — building unsigned release"
            ./gradlew :app:assembleRelease
          else
            echo "$XIKEY_STORE_FILE" | base64 -d > /tmp/xikey-release.jks
            export XIKEY_STORE_FILE=/tmp/xikey-release.jks
            ./gradlew :app:assembleRelease
          fi
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  instrumented:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest